<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连连看小游戏</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script type="application/javascript" src="composeApp.js"></script>
    <script src="wasm-feature-detect.js"></script>
</head>
<body>

<div id="loading-notice" class="center-container">
    <div class="center-content">
        <div class="loader"></div>
        <p id="loader-notice">
            我们需要一些时间来下载游戏资源……
        </p>
    </div>
</div>

<script>
    (async function() {
        if (await window.wasmFeatureDetect.gc()) {
            console.log("Support WasmGC")
        } else {
            console.log("Not Supported")
            document.querySelector("#loader-notice").textContent = "游戏无法在您的浏览器中运行，因为它不支持WasmGC"
        }
    })();
</script>

</body>
</html>
